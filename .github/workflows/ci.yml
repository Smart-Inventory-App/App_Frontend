name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

jobs:
  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: >-
          npm test -- --ci --coverage --passWithNoTests
          --collectCoverageFrom='src/**/*.{ts,tsx}'
          --collectCoverageFrom='app/**/*.{ts,tsx}'
          --coverageThreshold='{"global":{"lines":90,"statements":90}}'

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: app-frontend
          fail_ci_if_error: false

  eas-build-production:
    name: EAS Build (production)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/production'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package.json') }}
          restore-keys: node-modules-

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Set app version
        env:
          BASELINE_COMMITS: 72
        run: |
          count=$(git rev-list --first-parent --count HEAD)
          patch=$((count - BASELINE_COMMITS))
          node <<EOF
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const [major, minor] = app.expo.version.split('.');
          app.expo.version = [major, minor, $patch].join('.');
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log('App version: ' + app.expo.version);
          EOF
          version=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "App version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Android production
        run: eas build --platform android --profile production --non-interactive --json > build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          curl -fsSL "$url" -o "smart-inventory-v${VERSION}.apk"
          gh release create "v${VERSION}" "smart-inventory-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Smart Inventory v${VERSION}" \
            --notes "$(git log -1 --pretty=%B)"
